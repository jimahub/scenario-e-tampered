# SBOM 驅動的自動化 DevSecOps 管線 — 參考 workflow（對應論文 ch3 §3.3.2／§3.4.4／§3.5／§3.9.3）
#
# 設計重點：
#   1. 簽章端與驗證端分屬兩個 job，SBOM 經 artifact 傳遞，跨越一道信任邊界。
#   2. 先驗證、後掃描：Grype 只掃描通過簽章驗證的 SBOM。
#   3. 驗證時鎖定簽章身分（本 workflow 檔＋ref），不接受任意身分（不可用 regexp ".*"）。
#   4. 驗證端 job 不持有 id-token 權限，無法以本 workflow 身分簽章。
#   5. Policy Gate 腳本與 EPSS／KEV 凍結快照由驗證端自行從 repository 取得（不經 artifact），
#      否則能改寫 artifact 的攻擊者也能改寫判準。快照雜湊不符即判 FAIL。
#   6. 先保存證據、最後才執行判定：Stage 7 上傳稽核資料後，「Enforce decision」才依判定讓 job 失敗。
#   7. 全自動、無人工核准（2026-09-29）：PASS 與 WARN 均自動執行模擬部署；BLOCK／FAIL／驗證失敗時
#      驗證端 job 失敗，模擬部署不執行。部署條件只看 Policy Gate 的判定，不看情境代號。
#   8. 判定只決定「能否部署」；修補追蹤另行處理（enforce 模式）：所有未列入有效例外的漏洞（含 PASS）
#      依 remediation-policy.json 排定修補期限並同步追蹤 Issue（remediation.py）。
#      誤判或核可接受的風險寫入 .github/security/exceptions.json（須有理由、核可者、到期日），經 PR 審查；
#      人只處理例外，不介入每次執行。
#
# 計時：GitHub REST API 的步驟時間只精確到秒，所有時間指標在步驟內以毫秒計時（date +%s%N），寫入 metrics-*.json；
#   無法包在 run 內的 action（checkout、upload／download-artifact）以前後「時間戳記步驟」計時；
#   Grype 拆成漏洞資料庫下載（t_grype_db_ms）與實際掃描（t_grype_scan_ms）。
# Syft 只掃描 package-lock.json。Grype 使用預設模式（不可加 --by-cve：Grype 0.111.0 的 --by-cve 會丟掉 NVD 紀錄）。
#
# 各 repository 只需修改 env 區的 SCENARIO 與情境判準（EXPECT／TARGET_*）；情境 E 另插入 tamper job（見 scenario-e-tamper-job.yml）。
# 工具安裝：Syft／Grype 的 install.sh 取自對應版本標籤（非 main）；Cosign 直接下載 release 檔並比對官方 SHA-256。

name: SBOM-driven DevSecOps pipeline

on:
  # 情境 repository 只接受手動觸發，於正式實驗凍結工具版本後執行（論文 §3.7.3、§3.9.1、§4.2）
  workflow_dispatch:
    inputs:
      tamper_mode:
        description: 'semantic＝改 lodash 版本；byte＝檔末追加一個位元組'
        type: choice
        options: [ semantic, byte ]
        default: semantic

env:
  SCENARIO: 'Scenario E：SBOM 竄改'
  # 以下版本為預測試版本；正式實驗前統一更新至當時最新穩定版並凍結（論文 §3.7.3），
  # COSIGN_SHA256 取自該版 release 的 cosign_checksums.txt（cosign-linux-amd64 一列）
  SYFT_VERSION: v1.42.4
  GRYPE_VERSION: v0.111.0
  COSIGN_VERSION: v3.0.6
  COSIGN_SHA256: c956e5dfcac53d52bcf058360d579472f0c1d2d9b69f55209e256fe7783f4c74
  GATE_MODE: enforce          # enforce：BLOCK／FAIL 時中止、控制模擬部署並同步修補追蹤；record：只記錄（90 次受控執行用）
  EPSS_THRESHOLD: '0.1'
  CVSS_CRITICAL: '9.0'
  # 情境判準（§3.9.1；只供紀錄，不影響判定）。實驗專案留空。
  EXPECT: ''                  # PASS／WARN／BLOCK
  TARGET_CVE: ''              # 例：CVE-2019-10744
  TARGET_REASON: ''           # 例：CVSS_EPSS_LOW、CVSS+EPSS、KEV
  TARGET_PACKAGE: ''          # 例：lodash@4.17.4

jobs:
  # ── 簽章端（Producer）：Stage 1–3 ──────────────────────────────────
  build-and-sign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # 只有簽章端能取得本 workflow 的 OIDC 身分
    steps:
      # Stage 1　環境初始化（計時方式與 baseline.yml 相同）
      - name: Mark before checkout
        run: echo "t_checkout_start=$(date +%s%N)" >> "$RUNNER_TEMP/marks.env"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Mark after checkout
        run: echo "t_checkout_end=$(date +%s%N)" >> "$RUNNER_TEMP/marks.env"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          START=$(date +%s%N)
          npm ci --legacy-peer-deps   # B／C 刻意植入的 redis 3.0.2 與 typeorm 的 peer 需求衝突；與 lockfile 產生方式一致
          END=$(date +%s%N)
          echo "t_npm_ci_ms=$(( (END-START)/1000000 ))" >> "$RUNNER_TEMP/marks.env"

      # Stage 2　SBOM 生成（只掃描 lockfile）
      - name: Install Syft
        run: |
          START=$(date +%s%N)
          curl -sSfL "https://raw.githubusercontent.com/anchore/syft/${SYFT_VERSION}/install.sh" | sh -s -- -b /usr/local/bin "$SYFT_VERSION"
          END=$(date +%s%N)
          echo "t_syft_install_ms=$(( (END-START)/1000000 ))" >> "$RUNNER_TEMP/marks.env"
      - name: Generate SBOM
        run: |
          START=$(date +%s%N)
          syft scan file:package-lock.json -o cyclonedx-json=sbom.cdx.json
          END=$(date +%s%N)
          echo "t_syft_ms=$(( (END-START)/1000000 ))" >> "$RUNNER_TEMP/marks.env"

      # Stage 3　SBOM 簽章
      - name: Install Cosign (release binary + SHA-256)
        run: |
          START=$(date +%s%N)
          curl -sSfL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" -o /tmp/cosign
          echo "${COSIGN_SHA256}  /tmp/cosign" | sha256sum -c -
          sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign
          END=$(date +%s%N)
          echo "t_cosign_install_ms=$(( (END-START)/1000000 ))" >> "$RUNNER_TEMP/marks.env"
      - name: Sign SBOM
        run: |
          START=$(date +%s%N)
          cosign sign-blob --yes sbom.cdx.json --bundle sbom.bundle
          END=$(date +%s%N)
          echo "t_cosign_sign_ms=$(( (END-START)/1000000 ))" >> "$RUNNER_TEMP/marks.env"
      - name: Write producer metrics
        run: |
          python3 - <<'EOF'
          import json, os
          m = dict(l.strip().split('=', 1) for l in open(os.path.join(os.environ['RUNNER_TEMP'], 'marks.env')) if '=' in l)
          d = json.load(open('sbom.cdx.json'))
          out = {k: int(v) for k, v in m.items() if k.endswith('_ms')}
          out['checkout_ms'] = (int(m['t_checkout_end']) - int(m['t_checkout_start'])) // 1_000_000
          out['components'] = len([c for c in d.get('components', []) if c.get('type') == 'library'])
          out['image_os'], out['image_version'] = os.environ.get('ImageOS'), os.environ.get('ImageVersion')
          json.dump(out, open('metrics-producer.json', 'w'), indent=2)
          print(out)
          EOF

      # 跨越信任邊界：SBOM 與簽章束經 artifact 傳給驗證端（上傳前的時間戳記一併傳遞，用於計算跨 job 成本）
      - name: Mark before upload
        run: date +%s%N > upload_start.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-signed
          path: |
            sbom.cdx.json
            sbom.bundle
            metrics-producer.json
            upload_start.txt

  tamper:
    needs: [ build-and-sign ]
    runs-on: ubuntu-latest
    permissions:
      contents: read           # 無 id-token：無法以本 workflow 身分重新簽章
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sbom-signed
      - name: Tamper SBOM (simulated attack)
        env:
          TAMPER_MODE: ${{ inputs.tamper_mode || 'semantic' }}
        run: |
          python3 - <<'EOF'
          import json, os
          p, mode = 'sbom.cdx.json', os.environ['TAMPER_MODE']
          if mode == 'byte':
              open(p, 'ab').write(b' ')
              print('tamper_mode=byte: appended one space byte')
          else:
              sbom = json.load(open(p, encoding='utf-8'))
              n = 0
              for c in sbom.get('components', []):
                  if c.get('name') == 'lodash' and c.get('version') == '4.17.4':
                      c['version'] = '4.18.1'; n += 1
                      # Grype 以 purl 比對套件，只改 version 不足以規避掃描，攻擊者會連 purl 一併改寫
                      if 'purl' in c:
                          c['purl'] = c['purl'].replace('@4.17.4', '@4.18.1')
              json.dump(sbom, open(p, 'w', encoding='utf-8'), indent=2)
              print(f'tamper_mode=semantic: tampered components: {n}')
              assert n > 0, 'lodash@4.17.4 not found; scenario E precondition failed'
          print(mode, file=open('tamper-mode.txt', 'w'))
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-signed
          overwrite: true      # 以竄改後的 SBOM 取代原 artifact（簽章束維持原樣）
          path: |
            sbom.cdx.json
            sbom.bundle
            metrics-producer.json
            upload_start.txt
            tamper-mode.txt

  # ── 驗證端（Consumer）：Stage 4–7 ──────────────────────────────────
  # 情境 E 的 repository 在此 job 前插入 tamper job，並將 needs 改為 [ tamper ]
  verify-scan-gate:
    needs: [ tamper ]
    runs-on: ubuntu-latest
    permissions:
      contents: read           # 不給 id-token：驗證端無法以本 workflow 身分重新簽章
      issues: write            # 修補追蹤 Issue（enforce 模式）
    outputs:
      decision: ${{ steps.gate.outputs.decision }}
      gate_mode: ${{ env.GATE_MODE }}
    steps:
      - name: Mark before download
        run: echo "t_download_start=$(date +%s%N)" >> "$RUNNER_TEMP/marks.env"
      - uses: actions/download-artifact@v4
        with:
          name: sbom-signed
      - name: Mark after download
        run: echo "t_download_end=$(date +%s%N)" >> "$RUNNER_TEMP/marks.env"

      # Stage 4　SBOM 完整性驗證（鎖定簽章身分）
      - name: Install Cosign (release binary + SHA-256)
        run: |
          START=$(date +%s%N)
          curl -sSfL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" -o /tmp/cosign
          echo "${COSIGN_SHA256}  /tmp/cosign" | sha256sum -c -
          sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign
          END=$(date +%s%N)
          echo "t_cosign_install2_ms=$(( (END-START)/1000000 ))" >> "$RUNNER_TEMP/marks.env"
      - name: Verify SBOM integrity
        id: verify
        run: |
          START=$(date +%s%N)
          set +e
          cosign verify-blob sbom.cdx.json \
            --bundle sbom.bundle \
            --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" 2>&1 | tee verify.log
          STATUS=${PIPESTATUS[0]}
          set -e
          END=$(date +%s%N)
          echo "$STATUS" > verify-exit.txt
          echo "t_cosign_verify_ms=$(( (END-START)/1000000 ))" >> "$RUNNER_TEMP/marks.env"
          exit "$STATUS"

      # Stage 5　漏洞掃描（只掃描已驗證的 SBOM；資料庫下載與掃描分開計時）
      - name: Install Grype
        run: |
          START=$(date +%s%N)
          curl -sSfL "https://raw.githubusercontent.com/anchore/grype/${GRYPE_VERSION}/install.sh" | sh -s -- -b /usr/local/bin "$GRYPE_VERSION"
          END=$(date +%s%N)
          echo "t_grype_install_ms=$(( (END-START)/1000000 ))" >> "$RUNNER_TEMP/marks.env"
      - name: Update Grype DB
        run: |
          START=$(date +%s%N)
          grype db update
          END=$(date +%s%N)
          echo "t_grype_db_ms=$(( (END-START)/1000000 ))" >> "$RUNNER_TEMP/marks.env"
          grype db status | tee grype-db-status.txt
      - name: Scan vulnerabilities
        id: scan
        env:
          GRYPE_DB_AUTO_UPDATE: 'false'
        run: |
          START=$(date +%s%N)
          grype sbom:sbom.cdx.json -o json --file grype-results.json   # 預設模式；勿加 --by-cve
          END=$(date +%s%N)
          echo "t_grype_scan_ms=$(( (END-START)/1000000 ))" >> "$RUNNER_TEMP/marks.env"

      # Stage 6　Policy Gate（演算法 3.1）：判定腳本與凍結快照取自 repository，不取自 artifact
      - name: Mark before gate checkout
        run: echo "t_gate_checkout_start=$(date +%s%N)" >> "$RUNNER_TEMP/marks.env"
      - name: Checkout Policy Gate and frozen feeds
        uses: actions/checkout@v4
        with:
          path: trusted
          sparse-checkout: |
            .github/scripts
            .github/security
            feeds
          sparse-checkout-cone-mode: false
      - name: Mark after gate checkout
        run: echo "t_gate_checkout_end=$(date +%s%N)" >> "$RUNNER_TEMP/marks.env"
      - name: Policy Gate
        id: gate
        run: |
          START=$(date +%s%N)
          ARGS=()
          [ -n "$EXPECT" ] && ARGS+=(--expect "$EXPECT")
          [ -n "$TARGET_CVE" ] && ARGS+=(--target-cve "$TARGET_CVE")
          [ -n "$TARGET_REASON" ] && ARGS+=(--target-reason "$TARGET_REASON")
          [ -n "$TARGET_PACKAGE" ] && ARGS+=(--target-package "$TARGET_PACKAGE")
          DECISION=$(python3 trusted/.github/scripts/policy_gate.py grype-results.json \
            --epss trusted/feeds/epss.csv.gz --kev trusted/feeds/kev.json --sums trusted/feeds/SHA256SUMS \
            --exceptions trusted/.github/security/exceptions.json \
            --out decision.json "${ARGS[@]}")
          END=$(date +%s%N)
          echo "t_policy_gate_ms=$(( (END-START)/1000000 ))" >> "$RUNNER_TEMP/marks.env"
          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
          echo "Policy Gate: $DECISION"
          # 本步驟不因判定結果失敗：先完成 Stage 7 的證據保存，再由最後的 Enforce decision 執行判定

      # Stage 7a　修補追蹤（只在 enforce 模式；不計入 90 次受控執行的時間）
      - name: Remediation tracking
        if: env.GATE_MODE == 'enforce' && contains(fromJSON('["PASS","WARN","BLOCK"]'), steps.gate.outputs.decision)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 trusted/.github/scripts/remediation.py decision.json \
            --policy trusted/.github/security/remediation-policy.json --out remediation-plan.json \
            ${TARGET_PACKAGE:+--target-package "$TARGET_PACKAGE"} --create-issues
      - name: Write consumer metrics
        if: always()
        run: |
          python3 - <<'EOF'
          import json, os
          marks = dict(l.strip().split('=', 1) for l in open(os.path.join(os.environ['RUNNER_TEMP'], 'marks.env')) if '=' in l)
          out = {k: int(v) for k, v in marks.items() if k.endswith('_ms')}
          ms = lambda a, b: (int(marks[b]) - int(marks[a])) // 1_000_000 if a in marks and b in marks else None
          out['download_ms'] = ms('t_download_start', 't_download_end')
          out['gate_checkout_ms'] = ms('t_gate_checkout_start', 't_gate_checkout_end')
          try:
              # 上傳前到下載完成：含上傳、驗證端 job 等待與啟動、下載（跨 job 成本 T_xjob）
              out['xjob_ms'] = (int(marks['t_download_end']) - int(open('upload_start.txt').read().strip())) // 1_000_000
          except Exception:
              out['xjob_ms'] = None
          try:
              d = json.load(open('decision.json', encoding='utf-8'))
          except Exception:
              d = {'decision': None}
          out.update({'policy_gate': d.get('decision'), 'gate_mode': os.environ['GATE_MODE'],
                      'strategies': d.get('strategies'), 'total': d.get('total'),
                      'block': len(d.get('block_ids') or []), 'warn': len(d.get('warn_ids') or []), 'kev': len(d.get('kev_ids') or []),
                      'block_ids': d.get('block_ids'), 'warn_ids': d.get('warn_ids'), 'kev_ids': d.get('kev_ids'),
                      'data_gaps': d.get('data_gaps'), 'fail_reason': d.get('reason'),
                      'image_os': os.environ.get('ImageOS'), 'image_version': os.environ.get('ImageVersion')})
          json.dump(out, open('metrics-consumer.json', 'w'), indent=2, ensure_ascii=False)
          print(out)
          EOF
          sha256sum sbom.cdx.json sbom.bundle grype-results.json trusted/feeds/* trusted/.github/security/* 2>/dev/null > inputs-sha256.txt || true

      # Stage 7　結果彙整與發布（驗證失敗或 BLOCK 時仍執行，保留稽核紀錄）
      - name: Write Step Summary
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          def load(p):
              try: return json.load(open(p, encoding='utf-8'))
              except Exception: return {}
          p, c, k = load('metrics-producer.json'), load('metrics-consumer.json'), load('scenario-check.json')
          rp = load('remediation-plan.json')
          mark = {'success': '✅', 'failure': '❌', 'skipped': '⏭️ skipped'}
          o = lambda x: mark.get(os.environ.get(x, ''), os.environ.get(x, ''))
          print(f"## SBOM 驅動的自動化安全管線 — {os.environ['SCENARIO']}")
          print('| Stage | 結果 |')
          print('|---|---|')
          print(f"| Stage 2 SBOM 生成 | {p.get('components','—')} 個元件（{p.get('t_syft_ms','—')} ms） |")
          print(f"| Stage 3 Cosign 簽章 | {p.get('t_cosign_sign_ms','—')} ms |")
          print(f"| Stage 4 SBOM 完整性驗證 | {o('VERIFY_OUTCOME')} |")
          print(f"| Stage 5 漏洞掃描 | {o('SCAN_OUTCOME')}；{c.get('total','—')} 筆（DB {c.get('t_grype_db_ms','—')} ms＋掃描 {c.get('t_grype_scan_ms','—')} ms） |")
          print(f"| KEV 命中 | {c.get('kev','—')} {', '.join(c.get('kev_ids') or [])} |")
          print(f"| 資料缺值 | {c.get('data_gaps','—')} |")
          print(f"| **Stage 6 Policy Gate** | **{c.get('policy_gate','—')}**（BLOCK {c.get('block','—')}、WARN {c.get('warn','—')}；模式 {os.environ['GATE_MODE']}） |")
          if c.get('strategies'):
              s = c['strategies']
              print(f"| 三策略（管線層級） | 純 CVSS {s.get('s1')}／雙因子 {s.get('s2')}／三因子 {s.get('s3')} |")
          if rp:
              iss = rp.get('issues') or {}
              print(f"| 修補追蹤 | {rp.get('packages')} 個套件版本、{rp.get('vulns')} 筆漏洞 {rp.get('by_tier')}；"
                    f"Issue 新建 {len(iss.get('created', []))}、既有 {len(iss.get('existing', []))}、關閉 {len(iss.get('closed', []))}"
                    + (f"；目標套件已追蹤 {'✅' if rp.get('target_tracked') else '❌'}" if 'target_tracked' in rp else '') + ' |')
          if rp.get('excepted_ids'):
              print(f"| 有效例外（不參與判定） | {', '.join(rp['excepted_ids'])} |")
          if c.get('fail_reason'):
              print(f"| FAIL 原因 | {c['fail_reason']} |")
          if k:
              print(f"| 情境判準 | {'✅ 符合' if k.get('ok') else '❌ 不符'}：{json.dumps(k.get('checks'), ensure_ascii=False)} |")
          EOF
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-results
          if-no-files-found: ignore
          path: |
            sbom.cdx.json
            sbom.bundle
            verify.log
            verify-exit.txt
            grype-results.json
            grype-db-status.txt
            decision.json
            scenario-check.json
            remediation-plan.json
            inputs-sha256.txt
            metrics-producer.json
            metrics-consumer.json

      # 證據已保存後才執行判定
      - name: Enforce decision
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          DECISION: ${{ steps.gate.outputs.decision }}
        run: |
          echo "verify=$VERIFY_OUTCOME gate=$GATE_OUTCOME decision=${DECISION:-none} mode=$GATE_MODE"
          # 任何模式：驗證失敗、判定步驟未完成或輸入異常（FAIL）都使 job 失敗
          { [ "$VERIFY_OUTCOME" = success ] && [ "$GATE_OUTCOME" = success ]; } || exit 1
          case "$DECISION" in PASS|WARN|BLOCK) ;; *) exit 1;; esac
          # enforce 模式：BLOCK 中止（record 模式只記錄）
          if [ "$GATE_MODE" = enforce ] && [ "$DECISION" = BLOCK ]; then exit 1; fi

  # ── 模擬部署（隔離，不涉及任何實際環境；只在 enforce 模式執行；PASS 與 WARN 均自動執行，無人工核准） ──
  deploy-simulate:
    needs: [ verify-scan-gate ]
    if: needs.verify-scan-gate.outputs.gate_mode == 'enforce' && contains(fromJSON('["PASS","WARN"]'), needs.verify-scan-gate.outputs.decision)
    runs-on: ubuntu-latest
    permissions: {}
    env:
      DECISION: ${{ needs.verify-scan-gate.outputs.decision }}
    steps:
      - run: printf 'run_id=%s\npolicy=%s\napproval=not-required\nremediation=tracked-in-issues\nsimulated=true\n' "$GITHUB_RUN_ID" "$DECISION" > simulation.txt
      - uses: actions/upload-artifact@v4
        with:
          name: simulation-deploy
          path: simulation.txt
