# SBOM 驅動的自動化 DevSecOps 管線 — 參考 workflow（對應論文 ch3 §3.3.2／§3.4.4／§3.9.2）
#
# 設計重點：
#   1. 簽章端與驗證端分屬兩個 job，SBOM 經 artifact 傳遞，跨越一道信任邊界。
#   2. 先驗證、後掃描：Grype 只掃描通過簽章驗證的 SBOM。
#   3. 驗證時鎖定簽章身分（本 workflow 檔＋ref），不接受任意身分（不可用 regexp ".*"）。
#   4. 驗證端 job 不持有 id-token 權限，無法以本 workflow 身分簽章。
#   5. Policy Gate 在 enforce 模式下遇 BLOCK 以 exit 1 中止；效能實驗改用 record 模式（只記錄不中止）。
#
# 計時（2026-09-28 smoke test 後修訂）：GitHub REST API 的步驟時間只精確到秒，
# 因此所有時間指標改在步驟內以毫秒計時（date +%s%N），寫入 metrics-*.json：
#   - 無法包在 run 內的 action（checkout、upload／download-artifact）以前後「時間戳記步驟」計時；
#   - Grype 拆成漏洞資料庫下載（t_grype_db_ms）與實際掃描（t_grype_scan_ms），以區分固定成本。
# Syft 只掃描 package-lock.json（不掃整個目錄，避免把 workflow 用到的 GitHub Actions 與檔案當成元件）。
#
# 各情境 repository 只需修改 env.SCENARIO；情境 E 另插入 tamper job（見 scenario-e-tamper-job.yml）。
# 2026-09-28 smoke test 修正：cosign-installer 須用 v4.1.2（v3 不支援 Cosign v3.x，且沒有 v4 浮動標籤）；npm ci 須加 --legacy-peer-deps。

name: SBOM-driven DevSecOps pipeline

on:
  # 情境 repository 只接受手動觸發，於正式實驗凍結工具版本後執行（論文 §3.7.3、§4.6）
  workflow_dispatch:

env:
  SCENARIO: 'Scenario E：SBOM 竄改'
  # 以下三個版本為預測試版本；正式實驗前統一更新至當時最新穩定版並凍結（論文 §3.7.3）
  SYFT_VERSION: v1.42.4
  GRYPE_VERSION: v0.111.0
  COSIGN_VERSION: v3.0.6
  GATE_MODE: enforce          # enforce：BLOCK 時中止；record：只記錄（90 次效能實驗用）
  EPSS_THRESHOLD: '0.1'
  CVSS_CRITICAL: '9.0'

jobs:
  # ── 簽章端（Producer）：Stage 1–3 ──────────────────────────────────
  build-and-sign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # 只有簽章端能取得本 workflow 的 OIDC 身分
    steps:
      # Stage 1　環境初始化（計時方式與 baseline.yml 相同）
      - name: Mark before checkout
        run: echo "t_checkout_start=$(date +%s%N)" >> "$RUNNER_TEMP/marks.env"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Mark after checkout
        run: echo "t_checkout_end=$(date +%s%N)" >> "$RUNNER_TEMP/marks.env"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          START=$(date +%s%N)
          npm ci --legacy-peer-deps   # B／C 刻意植入的 redis 3.0.2 與 typeorm 的 peer 需求衝突；與 lockfile 產生方式一致
          END=$(date +%s%N)
          echo "t_npm_ci_ms=$(( (END-START)/1000000 ))" >> "$RUNNER_TEMP/marks.env"

      # Stage 2　SBOM 生成（只掃描 lockfile）
      - name: Install Syft
        run: |
          START=$(date +%s%N)
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin "$SYFT_VERSION"
          END=$(date +%s%N)
          echo "t_syft_install_ms=$(( (END-START)/1000000 ))" >> "$RUNNER_TEMP/marks.env"
      - name: Generate SBOM
        run: |
          START=$(date +%s%N)
          syft scan file:package-lock.json -o cyclonedx-json=sbom.cdx.json
          END=$(date +%s%N)
          echo "t_syft_ms=$(( (END-START)/1000000 ))" >> "$RUNNER_TEMP/marks.env"

      # Stage 3　SBOM 簽章
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2   # 須寫完整版本號（無 v4 浮動標籤）
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Sign SBOM
        run: |
          START=$(date +%s%N)
          cosign sign-blob --yes sbom.cdx.json --bundle sbom.bundle
          END=$(date +%s%N)
          echo "t_cosign_sign_ms=$(( (END-START)/1000000 ))" >> "$RUNNER_TEMP/marks.env"
      - name: Write producer metrics
        run: |
          python3 - <<'EOF'
          import json, os
          m = dict(l.strip().split('=', 1) for l in open(os.path.join(os.environ['RUNNER_TEMP'], 'marks.env')) if '=' in l)
          d = json.load(open('sbom.cdx.json'))
          out = {k: int(v) for k, v in m.items() if k.endswith('_ms')}
          out['checkout_ms'] = (int(m['t_checkout_end']) - int(m['t_checkout_start'])) // 1_000_000
          out['components'] = len([c for c in d.get('components', []) if c.get('type') == 'library'])
          out['image_os'], out['image_version'] = os.environ.get('ImageOS'), os.environ.get('ImageVersion')
          json.dump(out, open('metrics-producer.json', 'w'), indent=2)
          print(out)
          EOF

      # 跨越信任邊界：SBOM 與簽章束經 artifact 傳給驗證端（上傳前的時間戳記一併傳遞，用於計算跨 job 成本）
      - name: Mark before upload
        run: date +%s%N > upload_start.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-signed
          path: |
            sbom.cdx.json
            sbom.bundle
            metrics-producer.json
            upload_start.txt

  tamper:
    needs: [ build-and-sign ]
    runs-on: ubuntu-latest
    permissions:
      contents: read           # 無 id-token：無法以本 workflow 身分重新簽章
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sbom-signed
      - name: Tamper SBOM (simulated attack)
        run: |
          python3 - <<'EOF'
          import json
          p = 'sbom.cdx.json'
          sbom = json.load(open(p, encoding='utf-8'))
          n = 0
          for c in sbom.get('components', []):
              if c.get('name') == 'lodash' and c.get('version') == '4.17.4':
                  c['version'] = '4.17.21'; n += 1
                  # Grype 以 purl 比對套件，只改 version 不足以規避掃描，攻擊者會連 purl 一併改寫
                  if 'purl' in c:
                      c['purl'] = c['purl'].replace('@4.17.4', '@4.17.21')
          json.dump(sbom, open(p, 'w', encoding='utf-8'), indent=2)
          print(f'tampered components: {n}')
          assert n > 0, 'lodash@4.17.4 not found; scenario E precondition failed'
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-signed
          overwrite: true      # 以竄改後的 SBOM 取代原 artifact（簽章束維持原樣）
          path: |
            sbom.cdx.json
            sbom.bundle
            metrics-producer.json

  # ── 驗證端（Consumer）：Stage 4–7 ──────────────────────────────────
  # 情境 E 的 repository 在此 job 前插入 tamper job，並將 needs 改為 [ tamper ]
  verify-scan-gate:
    needs: [ tamper ]
    runs-on: ubuntu-latest
    permissions:
      contents: read           # 不給 id-token：驗證端無法以本 workflow 身分重新簽章
    steps:
      - name: Mark before download
        run: echo "t_download_start=$(date +%s%N)" >> "$RUNNER_TEMP/marks.env"
      - uses: actions/download-artifact@v4
        with:
          name: sbom-signed
      - name: Mark after download
        run: echo "t_download_end=$(date +%s%N)" >> "$RUNNER_TEMP/marks.env"

      # Stage 4　SBOM 完整性驗證（鎖定簽章身分）
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2   # 須寫完整版本號（無 v4 浮動標籤）
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Verify SBOM integrity
        id: verify
        run: |
          START=$(date +%s%N)
          cosign verify-blob sbom.cdx.json \
            --bundle sbom.bundle \
            --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          END=$(date +%s%N)
          echo "t_cosign_verify_ms=$(( (END-START)/1000000 ))" >> "$RUNNER_TEMP/marks.env"

      # Stage 5　漏洞掃描（只掃描已驗證的 SBOM；資料庫下載與掃描分開計時）
      - name: Install Grype
        run: |
          START=$(date +%s%N)
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin "$GRYPE_VERSION"
          END=$(date +%s%N)
          echo "t_grype_install_ms=$(( (END-START)/1000000 ))" >> "$RUNNER_TEMP/marks.env"
      - name: Update Grype DB
        run: |
          START=$(date +%s%N)
          grype db update
          END=$(date +%s%N)
          echo "t_grype_db_ms=$(( (END-START)/1000000 ))" >> "$RUNNER_TEMP/marks.env"
          grype db status | tee grype-db-status.txt
      - name: Scan vulnerabilities
        id: scan
        env:
          GRYPE_DB_AUTO_UPDATE: 'false'
        run: |
          START=$(date +%s%N)
          grype sbom:sbom.cdx.json -o json --file grype-results.json
          END=$(date +%s%N)
          echo "t_grype_scan_ms=$(( (END-START)/1000000 ))" >> "$RUNNER_TEMP/marks.env"

      # Stage 6　Policy Gate（演算法 3.1）
      - name: Policy Gate
        id: gate
        run: |
          python3 - <<'EOF'
          import json, os, sys, time
          t0 = time.time_ns()
          EPSS_T = float(os.environ['EPSS_THRESHOLD'])
          CVSS_T = float(os.environ['CVSS_CRITICAL'])
          report = json.load(open('grype-results.json'))
          matches = report.get('matches', [])
          block, warn, kev = [], [], []
          critical = 0
          for m in matches:
              v = m.get('vulnerability', {})
              if v.get('severity') == 'Critical':
                  critical += 1
              scores = [c.get('metrics', {}).get('baseScore', 0.0) for c in v.get('cvss', [])]
              cvss = max(scores) if scores else 0.0
              epss_list = v.get('epss', [])
              epss = epss_list[0].get('epss', 0.0) if epss_list else 0.0
              in_kev = bool(v.get('knownExploited', []))     # Grype v0.88.0+ 內建 KEV 欄位
              if in_kev:                                     # 路徑①：KEV 覆蓋
                  block.append(v.get('id')); kev.append(v.get('id'))
              elif cvss >= CVSS_T and epss >= EPSS_T:        # 路徑②：Critical＋EPSS 高
                  block.append(v.get('id'))
              elif cvss >= CVSS_T:                           # 路徑③：Critical＋EPSS 低
                  warn.append(v.get('id'))
                                                             # 其他：路徑④ PASS
          result = 'BLOCK' if block else ('WARN' if warn else 'PASS')
          marks = dict(l.strip().split('=', 1) for l in open(os.path.join(os.environ['RUNNER_TEMP'], 'marks.env')) if '=' in l)
          out = {k: int(v) for k, v in marks.items() if k.endswith('_ms')}
          out['download_ms'] = (int(marks['t_download_end']) - int(marks['t_download_start'])) // 1_000_000
          try:
              # 上傳前到下載完成：含上傳、驗證端 job 等待與啟動、下載（跨 job 成本 T_xjob）
              out['xjob_ms'] = (int(marks['t_download_end']) - int(open('upload_start.txt').read().strip())) // 1_000_000
          except Exception:
              out['xjob_ms'] = None
          out.update({'policy_gate': result, 'gate_mode': os.environ['GATE_MODE'],
                      'total': len(matches), 'critical': critical,
                      'block': len(block), 'warn': len(warn), 'kev': len(kev),
                      'block_ids': block, 'warn_ids': warn, 'kev_ids': kev,
                      'image_os': os.environ.get('ImageOS'), 'image_version': os.environ.get('ImageVersion'),
                      'policy_gate_ms': (time.time_ns() - t0) // 1_000_000})
          json.dump(out, open('metrics-consumer.json', 'w'), indent=2)
          print(f'Policy Gate: {result}  BLOCK={len(block)} WARN={len(warn)} KEV={len(kev)}')
          if result == 'BLOCK' and os.environ['GATE_MODE'] == 'enforce':
              sys.exit(1)
          EOF

      # Stage 7　結果彙整與發布（驗證失敗或 BLOCK 時仍執行，保留稽核紀錄）
      - name: Write Step Summary
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          def load(p):
              try: return json.load(open(p))
              except Exception: return {}
          p, c = load('metrics-producer.json'), load('metrics-consumer.json')
          mark = {'success': '✅', 'failure': '❌', 'skipped': '⏭️ skipped'}
          o = lambda k: mark.get(os.environ.get(k, ''), os.environ.get(k, ''))
          print(f"## SBOM 驅動的自動化安全管線 — {os.environ['SCENARIO']}")
          print('| Stage | 結果 |')
          print('|---|---|')
          print(f"| Stage 2 SBOM 生成 | {p.get('components','—')} 個元件（{p.get('t_syft_ms','—')} ms） |")
          print(f"| Stage 3 Cosign 簽章 | {p.get('t_cosign_sign_ms','—')} ms |")
          print(f"| Stage 4 SBOM 完整性驗證 | {o('VERIFY_OUTCOME')} |")
          print(f"| Stage 5 漏洞掃描 | {o('SCAN_OUTCOME')}；Total {c.get('total','—')}、Critical {c.get('critical','—')}（DB {c.get('t_grype_db_ms','—')} ms＋掃描 {c.get('t_grype_scan_ms','—')} ms） |")
          print(f"| KEV 命中 | {c.get('kev','—')} {', '.join(c.get('kev_ids', []))} |")
          print(f"| **Stage 6 Policy Gate** | **{c.get('policy_gate','—')}**（BLOCK {c.get('block','—')}、WARN {c.get('warn','—')}；模式 {os.environ['GATE_MODE']}） |")
          EOF
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-results
          if-no-files-found: ignore
          path: |
            sbom.cdx.json
            sbom.bundle
            grype-results.json
            grype-db-status.txt
            metrics-producer.json
            metrics-consumer.json
